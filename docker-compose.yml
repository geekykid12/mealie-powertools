# ─────────────────────────────────────────────────────────────────────────────
#  Mealie PowerTools — docker-compose.yml
#
#  Usage:
#    Option A — alongside a NEW Mealie install:
#      docker compose pull && docker compose up -d
#
#    Option B — alongside an EXISTING Mealie container:
#      Use docker-compose.attach.yml instead — see that file for instructions.
#
#  Access PowerTools at:  http://<this-machine-ip>:3000
#  Mealie URL to enter:   http://<mealie-ip>:9000/api
# ─────────────────────────────────────────────────────────────────────────────

networks:
  mealie-net:
    name: mealie-net
    driver: bridge

services:

  # ── Mealie ────────────────────────────────────────────────────────────────
  # Only include this if you don't have Mealie running yet.
  # If Mealie is already running, use docker-compose.attach.yml instead.
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    # No container_name here — avoids conflicts if Mealie is already running
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - ALLOW_SIGNUP=true
      - BASE_URL=http://localhost:9000
      - TZ=America/New_York
      # Default login: changeme@example.com / MyPassword
    volumes:
      - mealie-data:/app/data
    networks:
      - mealie-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/app/about"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Mealie PowerTools ──────────────────────────────────────────────────────
  powertools:
    image: ghcr.io/geekykid12/mealie-powertools:latest
    container_name: mealie-powertools
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - mealie-net
    depends_on:
      mealie:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1)"]
    labels:
      - "com.mealie.powertools=true"

volumes:
  mealie-data:
    driver: local

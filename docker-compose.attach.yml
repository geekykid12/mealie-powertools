# ─────────────────────────────────────────────────────────────────────────────
#  Use this file if Mealie is ALREADY RUNNING in its own compose stack.
#
#  1. Find your existing Mealie network name:
#       docker inspect mealie --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}'
#
#  2. Replace "mealie_default" below with your actual network name (appears twice).
#
#  3. Pull and run:
#       docker compose -f docker-compose.attach.yml pull
#       docker compose -f docker-compose.attach.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

networks:
  mealie_default:         # ← Change this to your existing Mealie network name
    external: true

services:
  powertools:
    image: ghcr.io/geekykid12/mealie-powertools:latest
    container_name: mealie-powertools
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - mealie_default    # ← Same name as above
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1)"]
